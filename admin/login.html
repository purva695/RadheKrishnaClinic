<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Radhe Krishna Clinic</title>

    <link rel="stylesheet"
        href="admin.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body class="login-page">


    <div class="login-container">


        <div class="login-card">


            <div class="admin-logo">

                <div class="admin-logo-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <h1>
                    Radhe Krishna Clinic
                </h1>

                <p>
                    Admin Panel
                </p>

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter admin email"
                            required>

                    </div>

                </div>



                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required>

                        <button
                            type="button"
                            id="togglePassword">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>



                <p
                    id="loginMessage"
                    class="login-message">
                </p>



                <button
                    type="submit"
                    class="admin-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>


            </form>


            <a
                href="../index.html"
                class="back-website">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Website

            </a>


        </div>

    </div>



    <script src="admin.js"></script>

</body>

</html>
