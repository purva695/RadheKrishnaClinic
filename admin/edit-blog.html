<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Blog | Radhe Krishna Clinic</title>

    <link rel="stylesheet" href="admin.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>


<body class="admin-page">


    <!-- ================================
         SIDEBAR
    ================================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-logo">

            <div class="sidebar-logo-icon">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>

            <div>
                <h2>Radhe Krishna</h2>
                <span>Clinic Admin</span>
            </div>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html">

                <i class="fa-solid fa-chart-line"></i>

                Dashboard

            </a>


            <a href="add-blog.html">

                <i class="fa-solid fa-plus"></i>

                Add New Blog

            </a>


            <a href="blogs.html" class="active">

                <i class="fa-solid fa-newspaper"></i>

                Manage Blogs

            </a>

        </nav>


        <div class="sidebar-bottom">

            <a href="../index.html" target="_blank">

                <i class="fa-solid fa-globe"></i>

                View Website

            </a>


            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>

    </aside>



    <!-- ================================
         MAIN CONTENT
    ================================= -->

    <main class="admin-main">


        <!-- HEADER -->

        <header class="admin-header">

            <button
                class="sidebar-toggle"
                id="sidebarToggle">

                <i class="fa-solid fa-bars"></i>

            </button>


            <div>

                <h1>Edit Blog</h1>

                <p>
                    Update your existing blog article.
                </p>

            </div>

        </header>



        <!-- ================================
             EDIT BLOG FORM
        ================================= -->

        <section class="blog-form-section">


            <form
                id="editBlogForm"
                class="blog-form">


                <!-- BLOG TITLE -->

                <div class="form-field full-width">

                    <label for="editBlogTitle">
                        Blog Title
                    </label>

                    <input
                        type="text"
                        id="editBlogTitle"
                        name="title"
                        value="Common Causes of Knee Pain"
                        placeholder="Enter blog title"
                        required>

                </div>



                <!-- CATEGORY -->

                <div class="form-field">

                    <label for="editBlogCategory">
                        Category
                    </label>

                    <select
                        id="editBlogCategory"
                        name="category"
                        required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Orthopedics" selected>
                            Orthopedics
                        </option>

                        <option value="Dermatology">
                            Dermatology
                        </option>

                        <option value="General Health">
                            General Health
                        </option>

                        <option value="Wellness">
                            Wellness
                        </option>

                    </select>

                </div>



                <!-- AUTHOR -->

                <div class="form-field">

                    <label for="editBlogAuthor">
                        Author
                    </label>

                    <input
                        type="text"
                        id="editBlogAuthor"
                        name="author"
                        value="Radhe Krishna Clinic"
                        placeholder="Author name">

                </div>



                <!-- ================================
                     CURRENT IMAGE
                ================================= -->

                <div class="form-field full-width">

                    <label>
                        Featured Image
                    </label>


                    <div class="current-image-box"
                        id="currentImageBox">


                        <p class="image-title">
                            Current Image
                        </p>


                        <div class="current-image-wrapper">

                            <img
                                id="currentBlogImage"
                                src="../images/blog-1.jpg"
                                alt="Current Blog Image">


                            <!-- REMOVE IMAGE BUTTON -->

                            <button
                                type="button"
                                id="removeCurrentImage"
                                class="remove-image-btn">

                                <i class="fa-solid fa-trash"></i>

                                Remove Image

                            </button>

                        </div>


                    </div>



                    <!-- IMAGE REMOVED MESSAGE -->

                    <div
                        id="imageRemovedMessage"
                        class="image-removed-message"
                        style="display: none;">

                        <i class="fa-solid fa-image"></i>

                        Current image has been removed.

                    </div>



                    <!-- ================================
                         UPLOAD NEW IMAGE
                    ================================= -->

                    <div class="file-upload">

                        <input
                            type="file"
                            id="editBlogImage"
                            name="image"
                            accept="image/*">


                        <label
                            for="editBlogImage"
                            class="file-label">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                            <span>
                                Choose New Image
                            </span>

                            <small>
                                JPG, PNG or WEBP
                            </small>

                        </label>

                    </div>



                    <!-- NEW IMAGE PREVIEW -->

                    <div
                        id="editImagePreview"
                        class="image-preview">
                    </div>


                </div>



                <!-- SHORT DESCRIPTION -->

                <div class="form-field full-width">

                    <label for="editBlogExcerpt">
                        Short Description
                    </label>


                    <textarea
                        id="editBlogExcerpt"
                        name="excerpt"
                        rows="4"
                        maxlength="250"
                        placeholder="Write a short description..."
                        required>Learn about the common causes of knee pain, warning signs and when you should consult an orthopedic specialist.</textarea>


                    <small class="field-hint">

                        This description appears on the blog card.

                    </small>

                </div>



                <!-- BLOG CONTENT -->

                <div class="form-field full-width">

                    <label for="editBlogContent">
                        Blog Content
                    </label>


                    <textarea
                        id="editBlogContent"
                        name="content"
                        rows="15"
                        placeholder="Write your complete blog content..."
                        required>Knee pain is a common problem that can affect people of different ages. It may occur because of injuries, overuse, age-related changes or other conditions.

Understanding the cause of knee pain is important because early evaluation can help prevent the problem from becoming more serious.

If your knee pain continues for a long time, becomes severe or affects your daily activities, it is advisable to consult a qualified orthopedic specialist.

At Radhe Krishna Clinic, patients can receive appropriate evaluation and guidance based on their symptoms and condition.</textarea>


                    <small class="field-hint">

                        You can edit the complete article here.

                    </small>

                </div>



                <!-- ACTION BUTTONS -->

                <div class="form-actions">

                    <a
                        href="blogs.html"
                        class="cancel-btn">

                        <i class="fa-solid fa-xmark"></i>

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="admin-primary-btn">

                        <i class="fa-solid fa-rotate"></i>

                        Update Blog

                    </button>

                </div>



                <!-- MESSAGE -->

                <p
                    id="editBlogMessage"
                    class="form-message">
                </p>


            </form>

        </section>

    </main>



    <script src="admin.js"></script>

</body>

</html>
